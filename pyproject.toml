[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-harness"
version = "0.1.0"
description = "A small, readable agent harness with tools, policy, tracing and evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.40",
  "pydantic>=2.8",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
mini-harness = "mini_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mini_harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
